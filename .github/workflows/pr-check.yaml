name: PR Check

on:
  pull_request:
    branches:
      - main

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      openapi: ${{ steps.filter.outputs.openapi }}
      aws-infra: ${{ steps.filter.outputs.aws-infra }}
      cf-infra: ${{ steps.filter.outputs.cf-infra }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
            openapi:
              - 'backend/openapi.yaml'
            aws-infra:
              - 'infra/**'
            cf-infra:
              - 'infra-cloudflare/**'
            backend:
              - 'backend/**'
              - '!backend/openapi.yaml'

  frontend-lint:
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint

  frontend-typecheck:
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm typecheck

  frontend-api-client:
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true' || needs.detect-changes.outputs.openapi == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate API client
        run: pnpm gen:api
      - name: Check for uncommitted changes
        run: git diff --exit-code src/libs/api/

  preview-aws-infra:
    needs: detect-changes
    if: needs.detect-changes.outputs.aws-infra == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment: prod
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-northeast-1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install CDK
        run: npm install -g aws-cdk
      - name: CDK Diff
        working-directory: infra
        run: cdk diff DattiStack
        env:
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          LINE_CHANNEL_ID: ${{ vars.LINE_CHANNEL_ID }}
          LINE_CHANNEL_SECRET: ${{ secrets.LINE_CHANNEL_SECRET }}

  preview-cf-infra:
    needs: detect-changes
    if: needs.detect-changes.outputs.cf-infra == 'true'
    runs-on: ubuntu-latest
    environment: prod
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra-cloudflare
    env:
      AWS_REGION: auto
      AWS_ACCESS_KEY_ID: ${{ secrets.PULUMI_STATE_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.PULUMI_STATE_R2_SECRET_ACCESS_KEY }}
      PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PULUMI_BACKEND_URL: s3://datti-pulumi-state?endpoint=https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com&s3ForcePathStyle=true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: infra-cloudflare/go.sum
      - name: Install Pulumi CLI
        uses: pulumi/actions@v6
      - name: List R2 backend objects (sanity check)
        run: |
          curl -sS -o /tmp/aws.zip "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip"
          unzip -q /tmp/aws.zip -d /tmp/awsroot
          sudo /tmp/awsroot/aws/install --update >/dev/null
          aws --endpoint-url "https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com" \
              s3 ls s3://datti-pulumi-state/.pulumi/ --recursive || echo "(empty or no access)"
      - name: Pulumi login
        run: pulumi login "$PULUMI_BACKEND_URL"
      - name: Pulumi stack select (create if missing)
        run: pulumi stack select --create "${{ vars.PULUMI_STACK_NAME }}"
      - name: Pre-fetch Go dependencies
        run: go mod download
      - name: Pulumi preview
        run: pulumi preview --non-interactive --diff

  backend-lint:
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.1"
          cache-dependency-path: backend/go.sum
      - name: Run go vet
        run: go vet ./...
