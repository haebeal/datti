name = "datti-backend"
main = "src/index.ts"
compatibility_date = "2026-06-13"

[observability]
enabled = true

[[containers]]
class_name = "BackendContainer"
image = "./Dockerfile"
max_instances = 5
instance_type = "basic"

[[durable_objects.bindings]]
name = "BACKEND"
class_name = "BackendContainer"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["BackendContainer"]

# 環境変数 (シークレットでないもののみ。シークレットは `wrangler secret put NAME` で個別に設定)
[vars]
PORT = "8080"
AWS_REGION = "ap-northeast-1"
CORS_ALLOW_ORIGINS = "https://dev.datti.app"
S3_AVATAR_BUCKET = "dev-datti-avatar"
AVATAR_BASE_URL = "https://avatar.dev.datti.app"
