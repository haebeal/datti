name: datti
runtime:
  name: go
  options:
    # Pulumi 実行時の内部ビルドをスキップして、事前ビルド済みバイナリを直接 exec する。
    # Cloudflare provider SDK のコンパイルが重く、言語ホストの実行時ビルド経路が CI で
    # ハングするため、CI 側で go build したバイナリ (./bin/pulumi-program) を使う。
    binary: ./bin/pulumi-program
description: Datti の Cloudflare リソース (R2 / Pages)
